<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Bird</title>
  <link rel="stylesheet" href="flappy.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <div class="game-shell">
    <header>
      <h1>Flappy Bird</h1>
      <p>Tap, click, or press Space to fly. Use the attached image as <code>bird.png</code> in this folder.</p>
    </header>

    <section class="game-area">
      <canvas id="gameCanvas" width="480" height="640"></canvas>
      <div class="hud">
        <div class="score">Score: <span id="score">0</span></div>
        <div class="best">Best: <span id="best">0</span></div>
      </div>
      <div id="message" class="message">Click or tap to start</div>
    </section>

    <footer>
      <p>To use the provided bird image, save it as <code>bird.png</code> next to this file.</p>
    </footer>
  </div>

  <script src="flappy.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    }
  </script>
</body>
</html>
